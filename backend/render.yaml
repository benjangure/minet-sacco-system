services:
  # Spring Boot Backend Service
  - type: web
    name: minetsacco-backend
    runtime: java
    plan: free  # Change to 'starter' for $7/month always-on service
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -jar target/minet-sacco-backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: minetsacco-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true  # Render will generate a secure random value
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx512m -Xms256m"
    healthCheckPath: /api/health
    autoDeploy: true

databases:
  # PostgreSQL Database
  - name: minetsacco-db
    databaseName: minetsacco
    user: minetsacco
    plan: free  # Free for 90 days, then $7/month
    region: oregon  # Change to singapore or frankfurt if closer to your users
