# Production Database Configuration for Minet SACCO
# Deploy this file to: C:\minetsacco-deploy\backend\target\application.properties

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/minetsacco?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=minetsacco
spring.datasource.password=0a0b0c0D.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=true
spring.flyway.locations=classpath:db/migration

# Server Configuration
server.port=9090
server.address=0.0.0.0

# Logging
logging.level.root=INFO
logging.level.com.minet.sacco=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.file.name=C:/minetsacco-deploy/backend/logs/application.log

# JWT Configuration (if needed)
jwt.secret=your-production-secret-key-here-make-it-long-and-secure
jwt.expiration=86400000

# Email Configuration (Office365 SMTP)
spring.mail.host=smtp.office365.com
spring.mail.port=587
spring.mail.username=no_reply@minet.co.ke
spring.mail.password=cffnppdshtrmbxlx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.from=no_reply@minet.co.ke
spring.mail.from-name=Minet SACCO

# Push Notification Configuration
vapid.public.key=your-vapid-public-key
vapid.private.key=your-vapid-private-key
