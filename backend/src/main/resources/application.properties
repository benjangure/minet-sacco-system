# ===== SPRING PROFILE CONFIGURATION =====
# Active profile determines which configuration to use:
# - dev: Local development (database: minetsacco)
# - prod: Production server (database: minetsacco)
# 
# To run with a specific profile:
# - Development: ./mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev
# - Production: ./mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=prod
# - Or in JAR: java -jar app.jar --spring.profiles.active=dev
#
spring.profiles.active=prod

# Server Configuration
server.port=9090
server.address=0.0.0.0

# Database Configuration (XAMPP MySQL for development)
spring.datasource.url=jdbc:mysql://localhost:3306/minetsacco?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=10&initialTimeout=1&connectTimeout=60000&socketTimeout=60000
spring.datasource.username=minetsacco
spring.datasource.password=0a0b0c0D.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Log slow queries (queries taking more than 1 second)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=1000

# Flyway
spring.flyway.enabled=true

