# ===== PERFORMANCE OPTIMIZATION =====

# Hibernate Batch Processing
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.default_batch_fetch_size=10

# Caching Configuration (Caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m
spring.cache.cache-names=members,memberById,memberByNumber,membersByStatus,allLoans,loanById,loansByMember,loansByStatus,trialBalanceReport,loanRegisterReport,cashbookReport,balanceSheetReport,dashboardStats,membersList,loansList,loansByStatusList,trialBalanceReportAPI,cashbookReportAPI

# Connection Pool Optimization (HikariCP)
# max-lifetime must be less than MySQL's wait_timeout (default 8 hours = 28800s)
# Set to 25 minutes (1500000ms) to safely recycle before MySQL kills idle connections
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1500000
# keepalive-time: send a test query every 2 minutes to keep connections alive
spring.datasource.hikari.keepalive-time=120000
# Validate connection before using it - prevents stale connection errors
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
# Pool name for easier log identification
spring.datasource.hikari.pool-name=MinetSaccoPool

