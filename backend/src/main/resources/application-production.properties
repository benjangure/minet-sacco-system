# Production Configuration for Render Deployment
# This file is activated when SPRING_PROFILES_ACTIVE=production

# ===========================================
# DATABASE CONFIGURATION (PostgreSQL on Render)
# ===========================================
# Render provides DATABASE_URL in format: postgresql://user:password@host:port/database
# Internal connection (used by Render services)
spring.datasource.url=${DATABASE_URL:postgresql://minetsacco:5WNIl6Ko7KCLmWkavtYeayPS69H3TxbM@dpg-d9u3rcbncjis73af26j0-a/minetsacco}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:minetsacco}
spring.datasource.password=${DB_PASSWORD:5WNIl6Ko7KCLmWkavtYeayPS69H3TxbM}

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===========================================
# JPA/HIBERNATE CONFIGURATION
# ===========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ===========================================
# FLYWAY MIGRATION CONFIGURATION
# ===========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# ===========================================
# SERVER CONFIGURATION
# ===========================================
server.port=${PORT:9090}
server.address=0.0.0.0
server.compression.enabled=true
server.http2.enabled=true

# ===========================================
# LOGGING CONFIGURATION
# ===========================================
logging.level.root=INFO
logging.level.com.minet.sacco=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===========================================
# JWT CONFIGURATION
# ===========================================
jwt.secret=${JWT_SECRET:default-secret-key-change-this-in-render-environment}
jwt.expiration=86400000

# ===========================================
# CORS CONFIGURATION
# ===========================================
# Allow requests from mobile apps and web frontend
cors.allowed-origins=https://minetsacco.onrender.com,https://*.onrender.com,capacitor://localhost,ionic://localhost,http://localhost:5173

# ===========================================
# M-PESA CONFIGURATION
# ===========================================
mpesa.consumer.key=${MPESA_CONSUMER_KEY:}
mpesa.consumer.secret=${MPESA_CONSUMER_SECRET:}
mpesa.shortcode=${MPESA_SHORTCODE:174379}
mpesa.passkey=${MPESA_PASSKEY:}
mpesa.callback.url=${MPESA_CALLBACK_URL:https://minetsacco.onrender.com/api/mpesa/callback}
mpesa.environment=${MPESA_ENV:sandbox}

# ===========================================
# EMAIL CONFIGURATION
# ===========================================
spring.mail.host=smtp.office365.com
spring.mail.port=587
spring.mail.username=no_reply@minet.co.ke
spring.mail.password=cffnppdshtrmbxlx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.from=no_reply@minet.co.ke
spring.mail.from-name=Minet SACCO

# ===========================================
# ACTUATOR (Health Check for Render)
# ===========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
