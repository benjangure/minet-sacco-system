# This file is used when running with: --spring.profiles.active=prod

# Server Configuration
server.port=9090
server.address=0.0.0.0

# Database Configuration (Production Server - Network MySQL)
spring.datasource.url=jdbc:mysql://10.39.60.15:3306/minetsacco?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=10&initialTimeout=1&connectTimeout=60000&socketTimeout=60000
