jwt.expiration=604800000

# ===== EMAIL CONFIGURATION (Office365 SMTP) =====
# Production uses environment variables for security:
# - SPRING_MAIL_USERNAME (your Office365 email)
# - SPRING_MAIL_PASSWORD (your Office365 app password)
#
# If not set, defaults to:
spring.mail.host=smtp.office365.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:no_reply@minet.co.ke}
spring.mail.password=${SPRING_MAIL_PASSWORD:cffnppdshtrmbxlx}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.from=no_reply@minet.co.ke
spring.mail.from-name=Minet SACCO
spring.mail.enabled=true

# Frontend URL (used in email links)
app.frontend.url=${APP_FRONTEND_URL:https://sacco.minet.co.ke}

# Encryption
jasypt.encryptor.password=${JASYPT_PASSWORD:encryptionPassword}

# Logging (production levels; raise temporarily via LOGGING_LEVEL_* env vars when debugging)
logging.level.com.minet.sacco=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.cors=WARN
logging.level.org.hibernate.SQL=WARN
# Write logs to file so we can read them
logging.file.name=C:/minetsacco-deploy/backend/logs/application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===== RETRY CONFIGURATION FOR EMAIL SENDING =====
spring.retry.max-attempts=3
spring.retry.backoff-delay=2000

# Performance Optimization
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# Caching Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# Connection Pool (Production - with keepalive to prevent stale connections)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.pool-name=MinetSaccoPool

